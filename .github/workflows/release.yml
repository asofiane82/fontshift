name: Publication

# Crée les installeurs macOS (Apple Silicon et Intel), Windows et Linux.
# - Étiquette « v* » poussée (git tag v1.1.0 && git push --tags) : brouillon de publication avec les installeurs.
# - Lancement manuel (onglet Actions › Publication › Run workflow) : installeurs téléchargeables
#   dans les artefacts de l'exécution (GITHUB_TOKEN ne peut pas créer seul une étiquette).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-apple-silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-intel
          - platform: windows-latest
            args: ''
            name: windows
          - platform: ubuntu-22.04
            args: ''
            name: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Signature et notarisation macOS facultatives : les secrets APPLE_* du dépôt ne sont transmis
      # que s'ils existent. Sans eux, l'application reçoit une signature ad hoc (signingIdentity « - »).
      - name: Signature macOS (si configurée)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then { echo "$v<<__FIN__"; printenv "$v"; echo "__FIN__"; } >> "$GITHUB_ENV"; fi
          done
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Fontaine v__VERSION__'
          releaseBody: 'Installeurs macOS, Windows et Linux.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Installeurs (artefacts de l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: fontaine-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  # Lot prêt à déposer sur un site : installeurs sous des noms fixes + version.json
  # (la page de téléchargement lit version.json pour afficher la version et les tailles).
  telechargements:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Noms fixes et version.json
        run: |
          set -e
          mkdir -p telechargements
          pick() { find artefacts/"$1" -type f -name "$2" | head -n 1; }
          copy() { src=$(pick "$1" "$2"); if [ -n "$src" ]; then cp "$src" "telechargements/$3"; fi; }
          copy fontaine-macos-apple-silicon '*.dmg'        Fontaine-macOS-Apple-Silicon.dmg
          copy fontaine-macos-intel         '*.dmg'        Fontaine-macOS-Intel.dmg
          copy fontaine-windows             '*-setup.exe'  Fontaine-Windows.exe
          copy fontaine-windows             '*.msi'        Fontaine-Windows.msi
          copy fontaine-linux               '*.AppImage'   Fontaine-Linux.AppImage
          copy fontaine-linux               '*.deb'        Fontaine-Linux.deb
          copy fontaine-linux               '*.rpm'        Fontaine-Linux.rpm
          VERSION=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("fs");
            const files = {};
            for (const f of fs.readdirSync("telechargements")) files[f] = fs.statSync("telechargements/" + f).size;
            fs.writeFileSync("telechargements/version.json", JSON.stringify({ version: process.argv[1], date: new Date().toISOString().slice(0, 10), files }, null, 2) + "\n");
          ' "$VERSION"
          ls -la telechargements && cat telechargements/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: fontaine-telechargements
          path: telechargements/
          if-no-files-found: error
