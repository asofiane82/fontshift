name: Publication

# Crée les installeurs macOS (Apple Silicon et Intel), Windows et Linux.
# - Étiquette « v* » poussée (git tag v1.1.0 && git push --tags) : brouillon de publication avec les installeurs.
# - Lancement manuel (onglet Actions › Publication › Run workflow) : installeurs téléchargeables
#   dans les artefacts de l'exécution (GITHUB_TOKEN ne peut pas créer seul une étiquette).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-apple-silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-intel
          - platform: windows-latest
            args: ''
            name: windows
          - platform: ubuntu-22.04
            args: ''
            name: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Signature et notarisation macOS facultatives : les secrets APPLE_* du dépôt ne sont transmis
      # que s'ils existent. Sans eux, l'application reçoit une signature ad hoc (signingIdentity « - »).
      # Mises à jour automatiques : les fichiers de mise à jour signés ne sont produits que si la clé
      # (secrets TAURI_SIGNING_PRIVATE_KEY et TAURI_SIGNING_PRIVATE_KEY_PASSWORD) est présente.
      - name: Clé de mise à jour (si configurée)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for v in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
              { echo "$v<<__FIN__"; printenv "$v"; echo "__FIN__"; } >> "$GITHUB_ENV"
            done
            echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          else
            echo "Pas de clé de mise à jour : installeurs sans fichiers de mise à jour."
          fi
      - name: Signature macOS (si configurée)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then { echo "$v<<__FIN__"; printenv "$v"; echo "__FIN__"; } >> "$GITHUB_ENV"; fi
          done
          # L'identité (« Developer ID Application: … (TEAMID) ») remplace la signature ad hoc de tauri.conf.json.
          if [ -n "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::APPLE_CERTIFICATE est défini sans APPLE_SIGNING_IDENTITY : ajoutez ce secret pour signer avec le Developer ID."
          fi
          if [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -z "$APPLE_ID$APPLE_PASSWORD$APPLE_TEAM_ID" ]; then
            echo "::warning::Signature sans notarisation : ajoutez APPLE_ID, APPLE_PASSWORD et APPLE_TEAM_ID."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Fontshift v__VERSION__'
          releaseBody: 'Installeurs macOS, Windows et Linux.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}
      - name: Installeurs (artefacts de l'exécution)
        uses: actions/upload-artifact@v4
        with:
          name: fontshift-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.sig

  # Lot prêt à déposer sur un site : installeurs sous des noms fixes + version.json
  # (la page de téléchargement lit version.json pour afficher la version et les tailles)
  # + latest.json et archives macOS pour les mises à jour automatiques, quand une adresse
  # est configurée dans tauri.conf.json et que la clé de mise à jour existe.
  telechargements:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Noms fixes et version.json
        run: |
          set -e
          mkdir -p telechargements signatures
          pick() { find artefacts/"$1" -type f -name "$2" | head -n 1; }
          # copie l'installeur sous son nom fixe, et sa signature de mise à jour si elle existe
          copy() {
            src=$(pick "$1" "$2")
            if [ -n "$src" ]; then
              cp "$src" "telechargements/$3"
              if [ -f "$src.sig" ]; then cp "$src.sig" "signatures/$3.sig"; fi
            fi
          }
          copy fontshift-macos-apple-silicon '*.dmg'         Fontshift-macOS-Apple-Silicon.dmg
          copy fontshift-macos-intel         '*.dmg'         Fontshift-macOS-Intel.dmg
          # archives de mise à jour macOS : utiles seulement si elles sont signées
          copy_signed() { src=$(pick "$1" "$2"); if [ -n "$src" ] && [ -f "$src.sig" ]; then cp "$src" "telechargements/$3"; cp "$src.sig" "signatures/$3.sig"; fi; }
          copy_signed fontshift-macos-apple-silicon '*.app.tar.gz'  Fontshift-macOS-Apple-Silicon.app.tar.gz
          copy_signed fontshift-macos-intel         '*.app.tar.gz'  Fontshift-macOS-Intel.app.tar.gz
          copy fontshift-windows             '*-setup.exe'   Fontshift-Windows.exe
          copy fontshift-windows             '*.msi'         Fontshift-Windows.msi
          copy fontshift-linux               '*.AppImage'    Fontshift-Linux.AppImage
          copy fontshift-linux               '*.deb'         Fontshift-Linux.deb
          copy fontshift-linux               '*.rpm'         Fontshift-Linux.rpm
          node scripts/latest-json.mjs telechargements signatures
          VERSION=$(node -p "require('./package.json').version")
          node -e '
            const fs = require("fs");
            const files = {};
            for (const f of fs.readdirSync("telechargements")) if (!f.endsWith(".json")) files[f] = fs.statSync("telechargements/" + f).size;
            fs.writeFileSync("telechargements/version.json", JSON.stringify({ version: process.argv[1], date: new Date().toISOString().slice(0, 10), files }, null, 2) + "\n");
          ' "$VERSION"
          ls -la telechargements && cat telechargements/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: fontshift-telechargements
          path: telechargements/
          if-no-files-found: error
